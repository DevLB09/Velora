<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Someone made you a surprise!</title>
    <link rel="icon" type="image/png" href="assets/favicon5.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
</head>
<body class="final-body">

    <div class="reveal-container">
        <h1 class="reveal-title">Surprise ! Look what I made for you!</h1>

        <div id="final-bouquet-view" class="final-canvas">
            <img id="final-base-img" src="" class="bouquet-base">
        </div>

        <div id="final-box-view" class="final-canvas"></div>

        <div class="final-card-display">
            <div class="letter-card">
                <div class="letter-content">
                    <p id="display-to"></p>
                    <p id="display-message" class="cursive-text"></p>
                    <div class="signature-block">
                        <p>Sincerely,</p>
                        <p id="display-from"></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="final-actions">
            <button onclick="window.location.href='index.html'" class="btn-primary">MAKE YOUR OWN</button>
            <button onclick="generateShareLink()" class="btn-secondary" id="share-btn">SHARE THIS GIFT</button>
        </div>
    </div>

    <script src="final.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<div id="support-modal" class="modal-overlay" style="display: none;">
    <div class="support-card">
        <h3 style="font-family: 'DM Serif Display', serif;">Support Velora 🌸</h3>
        <p>Loved building your bouquet? Support the developer to help keep our digital garden growing.</p>
        
        <div class="payment-box">
            <div class="bkash-info">
                <p style="color: #D12053; font-weight: bold;">bKash (Personal)</p>
                <p style="font-size: 1.2rem; margin: 10px 0;"><strong>01XXXXXXXXX</strong></p>
                <p style="font-size: 0.8rem; color: #666;">Please use "Send Money"</p>
            </div>
            
            <div class="trx-input">
                <input type="text" id="trx-id" placeholder="Transaction ID (Optional)" 
                       style="padding: 10px; border: 1px solid #ddd; border-radius: 5px; width: 80%; margin-bottom: 10px;">
                <br>
                <button onclick="submitSupport()" class="submit-btn">Verify & Continue</button>
            </div>
        </div>
        
        <button onclick="closeSupportModal()" class="close-text">No pressure, thanks for stopping by!</button>
    </div>
</div>
</body>
</html>
